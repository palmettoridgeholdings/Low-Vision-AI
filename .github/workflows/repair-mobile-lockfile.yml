name: Repair mobile lockfile

on:
  push:
    branches:
      - codex/android-mvp-foundation
    paths:
      - .github/workflows/repair-mobile-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate package lockfile
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log('package-lock.json is valid JSON')"

      - name: Install dependencies from regenerated lockfile
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Tests
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Upload repaired lockfile fallback
        uses: actions/upload-artifact@v4
        with:
          name: repaired-mobile-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error

      - name: Commit repaired lockfile and remove temporary workflow
        run: |
          rm -f .github/workflows/repair-mobile-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mobile/package-lock.json .github/workflows/repair-mobile-lockfile.yml
          git commit -m "Repair mobile package lockfile and verify dependencies"
          git push origin HEAD:codex/android-mvp-foundation
