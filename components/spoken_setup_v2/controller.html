<section class="access-ai-speech-controller" aria-labelledby="speech-controller-title">
  <h2 id="speech-controller-title">Access AI spoken setup</h2>
  <p data-status role="status" aria-live="polite">Spoken guidance is ready.</p>
  <div class="speech-controls" role="group" aria-label="Spoken setup controls">
    <button type="button" data-action="pause">Pause</button>
    <button type="button" data-action="resume">Resume</button>
    <button type="button" data-action="repeat">Repeat</button>
    <button type="button" data-action="stop">Stop voice</button>
    <button type="button" data-action="restore">Restore voice</button>
  </div>
  <button type="button" class="unlock" data-action="unlock" hidden>
    Access AI. Tap anywhere to begin spoken setup.
  </button>
  <details>
    <summary>Playback diagnostics</summary>
    <ol data-diagnostics aria-label="Redacted playback diagnostics"></ol>
  </details>
</section>
