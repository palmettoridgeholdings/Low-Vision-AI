<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access AI spoken setup</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; min-height: 100%; margin: 0; }
      body { background: transparent; color: CanvasText; }
      #app {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 104px;
        padding: 0.5rem;
      }
      #app.first-screen { min-height: 72vh; }
      #intro {
        width: min(42rem, 100%);
        text-align: center;
        padding: 2rem 1rem 7rem;
      }
      #intro h1 { margin: 0 0 0.75rem; font-size: clamp(2.2rem, 8vw, 4rem); }
      #intro p { margin: 0; font-size: clamp(1.15rem, 4vw, 1.5rem); line-height: 1.5; }
      #unlock {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        min-height: 100%;
        border: 4px solid #ffd43b;
        border-radius: 1rem;
        background: #111827;
        color: #ffffff;
        padding: 2rem 1rem 7rem;
        font: inherit;
        font-size: clamp(1.5rem, 6vw, 2.5rem);
        font-weight: 750;
        line-height: 1.35;
        cursor: pointer;
      }
      #unlock:focus-visible, #visible-start:focus-visible {
        outline: 4px solid #ffd43b;
        outline-offset: 4px;
      }
      #visible-start {
        position: absolute;
        z-index: 2;
        left: 50%;
        bottom: 2rem;
        transform: translateX(-50%);
        width: min(32rem, calc(100% - 2rem));
        min-height: 4.5rem;
        border: 2px solid #ffffff;
        border-radius: 0.75rem;
        background: #a61b1b;
        color: #ffffff;
        padding: 0.75rem 1rem;
        font: inherit;
        font-size: 1.25rem;
        font-weight: 750;
        cursor: pointer;
      }
      #status {
        width: 100%;
        text-align: center;
        font-size: 1.05rem;
        line-height: 1.4;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div id="intro">
        <h1>Access AI</h1>
        <p id="status">Preparing spoken setup…</p>
      </div>
      <button id="unlock" type="button" hidden></button>
      <button id="visible-start" type="button" hidden></button>
      <audio id="audio" preload="auto"></audio>
    </main>

    <script>
      const app = document.getElementById("app");
      const audio = document.getElementById("audio");
      const unlock = document.getElementById("unlock");
      const visibleStart = document.getElementById("visible-start");
      const status = document.getElementById("status");

      let args = {};
      let currentToken = null;
      let currentStep = null;
      let eventSequence = 0;
      let blocked = false;

      function post(type, payload = {}) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
      }

      function setFrameHeight(height) {
        post("streamlit:setFrameHeight", { height });
      }

      function emit(kind, input = "browser") {
        eventSequence += 1;
        post("streamlit:setComponentValue", {
          value: {
            id: `${currentToken}:${kind}:${eventSequence}`,
            kind,
            input,
            step: currentStep,
          },
        });
      }

      function showBlockedFallback() {
        blocked = true;
        unlock.textContent = args.unlock_label;
        unlock.setAttribute("aria-label", args.unlock_label);
        unlock.hidden = false;
        status.textContent = "Spoken setup is ready.";
        requestAnimationFrame(() => unlock.focus({ preventScroll: true }));
      }

      function showPlaying() {
        blocked = false;
        unlock.hidden = true;
        status.textContent = "Spoken setup is playing.";
      }

      async function playAudio(input) {
        if (!audio.src) return;
        try {
          await audio.play();
          showPlaying();
          emit(input === "autoplay" ? "autoplay_started" : "audio_unlocked", input);
        } catch (_error) {
          showBlockedFallback();
          if (input === "autoplay") {
            emit("autoplay_blocked", input);
          }
        }
      }

      function activateUnlock(input) {
        if (input === "keyboard") {
          status.textContent = "Starting spoken setup.";
        }
        playAudio(input);
      }

      unlock.addEventListener("click", () => activateUnlock("tap"));
      unlock.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activateUnlock("keyboard");
        }
      });

      visibleStart.addEventListener("click", (event) => {
        event.stopPropagation();
        audio.pause();
        emit("start_visible", "visible_button");
      });

      audio.addEventListener("ended", () => emit("audio_ended", "playback"));

      function render(event) {
        args = event.data.args || {};
        currentStep = args.step_id;
        const firstScreen = Boolean(args.first_screen);
        app.classList.toggle("first-screen", firstScreen);
        visibleStart.hidden = !firstScreen;
        visibleStart.textContent = args.visible_start_label || "Start accessible setup";
        setFrameHeight(firstScreen ? Math.max(520, Math.floor(window.innerHeight * 0.72)) : 112);

        if (!args.audio_b64 || args.audio_token === currentToken) return;
        currentToken = args.audio_token;
        blocked = false;
        unlock.hidden = true;
        audio.src = `data:${args.audio_mime || "audio/mpeg"};base64,${args.audio_b64}`;
        status.textContent = "Preparing spoken setup…";
        playAudio("autoplay");
      }

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") render(event);
      });

      post("streamlit:componentReady", { apiVersion: 1 });
    </script>
  </body>
</html>
