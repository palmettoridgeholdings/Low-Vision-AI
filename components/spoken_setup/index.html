<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access AI setup speech</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:system-ui,sans-serif}button{width:100%;min-height:48px;padding:.65rem 1rem;border:2px solid currentColor;border-radius:.5rem;background:Canvas;color:CanvasText;font:inherit;font-weight:700}button:focus-visible{outline:4px solid #ffd43b;outline-offset:2px}</style></head><body>
<button id="repeat" type="button">Repeat this setup instruction</button>
<script>
const repeat=document.getElementById("repeat");let args={},lastToken=null;
function post(type,payload={}){window.parent.postMessage({isStreamlitMessage:true,type,...payload},"*")}
function speak(){if(!("speechSynthesis" in window)||!args.speech_text)return;window.speechSynthesis.cancel();window.speechSynthesis.speak(new SpeechSynthesisUtterance(args.speech_text))}
repeat.addEventListener("click",speak);
window.addEventListener("message",event=>{if(!event.data||event.data.type!=="streamlit:render")return;args=event.data.args||{};repeat.textContent=args.repeat_label||"Repeat this setup instruction";repeat.setAttribute("aria-label",repeat.textContent);post("streamlit:setFrameHeight",{height:60});if(args.speak&&args.speech_token!==lastToken){lastToken=args.speech_token;speak()}});
post("streamlit:componentReady",{apiVersion:1});
</script></body></html>
